<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
<script>
  // Apply a saved light preference before first paint, so the page doesn't flash dark.
  // "tva-theme" is the key from before the project was renamed.
  try { if ((localStorage.getItem("equity-watch.theme") ?? localStorage.getItem("tva-theme")) === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>
<style>
  /* Palette copied from uniquetrades-congress (Catppuccin Mocha / Latte). Dark is the default. */
  :root {
    --bg: #1e1e2e;
    --surface: #313244;
    --surface2: #45475a;
    --border: #585b70;
    --text: #cdd6f4;
    --subtext: #a6adc8;
    --muted: #6c7086;
    --accent: #89b4fa;
    --green: #a6e3a1;
    --red: #f38ba8;
    --yellow: #f9e2af;
    --peach: #fab387;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #eff1f5;
    --surface: #e6e9ef;
    --surface2: #dce0e8;
    --border: #bcc0cc;
    --text: #4c4f69;
    --subtext: #5c5f77;
    --muted: #9ca0b0;
    --accent: #1e66f5;
    --green: #40a02b;
    --red: #d20f39;
    --yellow: #df8e1d;
    --peach: #fe640b;
    --shadow: 0 2px 12px rgba(0,0,0,0.12);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { font-size: 15px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  body.drawer-open { overflow: hidden; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button {
    font: inherit; font-size: 0.8rem; color: var(--text); background: var(--surface2);
    border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem 0.7rem; cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--border); }
  input[type="search"], input[type="text"], input[type="number"], input[type="date"], select {
    font: inherit; font-size: 0.85rem; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.6rem;
  }
  code { font-size: 0.85em; background: var(--surface2); padding: 0 0.3rem; border-radius: 4px; }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 0.78rem; }
  /* A queued change that is past due: still the note's size, but not ignorable. */
  .note.warn { color: var(--yellow); }
  /* The header's clock line when a check is overdue, same signal as .note.warn. */
  #updated.stale { color: var(--yellow); }

  /*
   * The Schwab login expiring stops checks outright, and only a person at the
   * machine can fix it - so it gets a banner rather than a tint on the clock
   * line. Yellow, not red: nothing is lost while it waits, queued edits simply
   * sit until the login is renewed.
   */
  #auth-banner {
    background: var(--surface2); border: 1px solid var(--yellow); border-left-width: 4px;
    border-radius: 6px; padding: 0.6rem 0.9rem; margin-bottom: 1rem; font-size: 0.85rem;
  }
  #auth-banner strong { color: var(--yellow); }
  #auth-banner .auth-detail { color: var(--subtext); display: block; margin-top: 0.2rem; }

  .site-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
  }
  .site-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; margin: 0; }
  .site-nav { display: flex; gap: 0.25rem; }
  .site-nav a { color: var(--subtext); padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.9rem; }
  .site-nav a:hover { background: var(--surface2); text-decoration: none; }
  .site-nav a[aria-current="page"] { color: var(--text); background: var(--surface2); }
  .nav-count { color: var(--muted); font-size: 0.8rem; }
  .meta { color: var(--subtext); font-size: 0.8rem; }
  .spacer { flex: 1; }
  .header-right { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }

  main { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  .section-header {
    display: flex; align-items: baseline; gap: 0.75rem;
    margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
  }
  .section-header:first-child { margin-top: 0; }
  .section-title { font-size: 1rem; font-weight: 700; margin: 0; }
  .section-count { font-size: 0.8rem; color: var(--muted); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 1rem; }
  .tile .value { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .label { color: var(--subtext); font-size: 0.8rem; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .empty { padding: 0.9rem 1rem; color: var(--muted); }
  #error { margin-bottom: 1rem; color: var(--red); }

  .queue-row { display: grid; grid-template-columns: 48px 1fr; gap: 12px; padding: 0.8rem 1rem; border-top: 1px solid var(--border); }
  .queue-row:first-child { border-top: 0; }
  .priority { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; color: var(--accent); }
  .priority.none { color: var(--muted); }
  .headline { font-size: 1rem; font-weight: 500; }
  a.plain { color: inherit; }
  a.plain:hover { color: var(--accent); }
  .sub { color: var(--subtext); font-size: 0.85rem; }
  .why { color: var(--muted); font-size: 0.78rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .tag { display: inline-block; font-size: 0.72rem; padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--subtext); margin-left: 6px; vertical-align: 1px; }
  .tag.held { border-color: var(--accent); color: var(--accent); }
  .tag.alert { border-color: var(--accent); color: var(--accent); }
  /* The held tag is a link into the Holdings view; keep it looking like a tag. */
  a.tag:hover { text-decoration: none; background: var(--surface2); }
  .tag.reversed { border-color: var(--peach); color: var(--peach); }
  /* What `holdings check` would say about a position, worked out in the
     browser (see holdingFlags in app.js). Green for clearing cost by the
     threshold, peach for money that has sat still — neither is an alarm. */
  .tag.above-basis { border-color: var(--green); color: var(--green); }
  .tag.stagnant { border-color: var(--peach); color: var(--peach); }
  .reversal-note { color: var(--peach); }
  /* Something changed since this fire was queued: the alert re-levelled or
     removed, more crossings folded on. Marked, because a row that has moved on
     reads differently from one that hasn't. */
  .update-note { color: var(--yellow); }
  /* Only ever rendered from the decrypted vault, never from dashboard.json. */
  .position-note { color: var(--subtext); }
  ol.timeline { margin: 0; padding-left: 18px; }
  ol.timeline li { margin-bottom: 2px; }
  ol.timeline li.reversal { color: var(--peach); }

  .trigger-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; padding: 0.55rem 1rem; border-top: 1px solid var(--border); align-items: baseline; }
  .trigger-row:first-child { border-top: 0; }
  .trigger-row { color: var(--text); cursor: pointer; }
  .trigger-row:hover, tr.clickable:hover { background: var(--surface2); }
  .trigger-row:focus-visible, tr.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  a.sym { font-weight: 700; color: var(--accent); }
  .trigger-row.new { box-shadow: inset 3px 0 0 var(--yellow); }
  .when { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .status { font-size: 0.8rem; color: var(--muted); }

  .story { padding: 0.8rem 1rem; border-top: 1px solid var(--border); }
  .story:first-child { border-top: 0; }
  .story ol { margin: 6px 0 0; padding-left: 18px; color: var(--subtext); font-size: 0.85rem; }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 12px; text-align: right; white-space: nowrap; border-top: 1px solid var(--border); }
  th { font-size: 0.8rem; font-weight: 500; color: var(--subtext); border-top: 0; cursor: pointer; user-select: none; background: var(--surface2); }
  th[aria-sort] { color: var(--text); }
  th:first-child, td:first-child { text-align: left; }
  tr.ignored td { color: var(--muted); }
  tr.clickable { cursor: pointer; }
  /* The position #/holdings/<symbol> points at, scrolled to and marked. */
  tr.focused > td { background: var(--surface2); }
  tr.focused > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  #alerts-table th { cursor: default; }
  #alerts-table th:nth-child(2) { text-align: left; }
  #alerts-table td.cond { text-align: left; white-space: normal; min-width: 14rem; color: var(--subtext); }
  #alerts-table th:nth-child(3), #alerts-table td.dir { text-align: left; }
  .bar-cell { width: 140px; }
  .bar { position: relative; height: 10px; background: var(--surface2); border-radius: 2px; }
  .bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .bar span { position: absolute; top: 0; bottom: 0; }
  .bar span.up { left: 50%; background: var(--green); border-radius: 0 2px 2px 0; }
  .bar span.down { right: 50%; background: var(--red); border-radius: 2px 0 0 2px; }

  /*
   * The A-Z rail beside a long table. Sticky rather than fixed: it is the page
   * that scrolls, so the rail only needs to stay put within its own column.
   * How many tabs it shows is decided in app.js from the height actually
   * available - the letters are grouped into ranges when they don't all fit.
   */
  .indexed { display: flex; align-items: flex-start; gap: 0.5rem; }
  .indexed > .table-wrap { flex: 1 1 auto; min-width: 0; }
  .alpha-rail {
    position: sticky; top: 0.75rem; flex: 0 0 auto;
    display: flex; flex-direction: column; gap: 1px;
  }
  .alpha-rail button {
    font-size: 0.7rem; line-height: 1.1; padding: 2px 4px; min-width: 2.5rem;
    background: none; border: 0; border-radius: 3px; color: var(--subtext);
  }
  .alpha-rail button:hover { background: var(--surface2); color: var(--text); }
  /* A letter nothing starts with stays in place, so the rail doesn't reflow as you filter. */
  .alpha-rail button[disabled] { color: var(--border); cursor: default; background: none; }
  /* Where the last jump landed; cleared on the next one. Same marker as tr.focused. */
  tr.jumped > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
  .toolbar input[type="search"] { flex: 1 1 14rem; min-width: 0; }

  details summary { cursor: pointer; color: var(--subtext); padding: 0.7rem 1rem; }
  details ul { margin: 0; padding: 0 1rem 0.8rem 2rem; color: var(--subtext); }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 15; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(34rem, 100vw);
    background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow);
    z-index: 20; overflow-y: auto; padding: 1rem 1.25rem 2rem; outline: none;
  }
  .drawer-close { float: right; }
  .drawer-title { font-size: 1.1rem; margin: 0.25rem 0 1rem; padding-right: 4rem; }
  /* Sits above the drawer (a ticker inside a trigger/alert drawer opens the
     chart on top of it), in one shared panel that swaps its iframe's src per
     symbol rather than opening a new tab per ticker. */
  .chart-backdrop { z-index: 21; }
  .chart-panel {
    position: fixed; inset: 4vh 4vw; z-index: 22; flex-direction: column;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 1rem 1.25rem; outline: none;
  }
  /* display must stay unset in the base rule above: an author-stylesheet
     `display` on this class overrides the UA stylesheet's `[hidden] { display:
     none }` even while the hidden attribute is present, at equal specificity. */
  .chart-panel:not([hidden]) { display: flex; }
  .chart-panel iframe { flex: 1; width: 100%; border: 0; border-radius: 6px; }
  body.chart-open { overflow: hidden; }
  @media (max-width: 700px) {
    .chart-panel { inset: 2vh 2vw; padding: 0.6rem; }
  }
  .drawer-sub { font-size: 0.9rem; margin: 1.5rem 0 0.5rem; color: var(--subtext); }
  dl.kv-list { display: grid; grid-template-columns: max-content 1fr; gap: 0.5rem 1rem; margin: 0; }
  dl.kv-list dt { color: var(--subtext); font-size: 0.85rem; }
  dl.kv-list dd { margin: 0; overflow-wrap: anywhere; }
  .drawer .trigger-row { grid-template-columns: 110px 1fr auto; }

  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 25; max-width: min(420px, calc(100vw - 32px)); }
  .toast {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-left: 3px solid var(--yellow);
    border-radius: var(--radius); padding: 0.65rem 0.9rem; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 1fr auto; gap: 10px; animation: slide .2s ease-out;
  }
  .toast .t-body { cursor: pointer; }
  .toast .t-sym { font-weight: 700; color: var(--accent); }
  .toast button { background: transparent; border: 0; padding: 0 2px; font-size: 1rem; line-height: 1; }
  .toast.ok { border-left-color: var(--green); }
  .toast.bad { border-left-color: var(--red); }
  @keyframes slide { from { transform: translateY(8px); opacity: 0; } }

  /* `:not([hidden])` for the same reason .chart-panel needs it above: this
     author `display` would otherwise beat the UA stylesheet's
     `[hidden] { display: none }` at equal specificity, and a toggled-off form
     (a stop's Edit) would stay on screen with the attribute set. */
  .ops-form:not([hidden]) { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.5rem 0.75rem; }
  .ops-form { padding: 0.75rem 1rem; margin-bottom: 1rem; overflow: visible; }
  .ops-form .form-title { flex-basis: 100%; font-size: 0.9rem; }
  .ops-form .note { flex-basis: 100%; }
  /* `:not([hidden])` for the same reason .ops-form and .chart-panel need it:
     this author `display` beats the UA stylesheet's `[hidden] { display: none }`
     at equal specificity, so a field toggled off by kind would stay on screen. */
  .field:not([hidden]) { display: flex; flex-direction: column; }
  .field { gap: 2px; font-size: 0.75rem; color: var(--subtext); }
  .field input[type="number"] { width: 8rem; }
  .field input[type="text"] { width: 7rem; text-transform: uppercase; }
  /* The volume amount is the one text field that isn't a ticker; uppercasing
     it is wanted here, since "2.5m" shown as "2.5M" is what it means. The
     window beside it is a select, so it needs nothing. */
  .form-error { color: var(--red); font-size: 0.8rem; align-self: center; }
  .tag.pending { border-color: var(--yellow); color: var(--yellow); }
  #ops-pending { margin-bottom: 1rem; }
  .pending-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0.5rem 1rem; border-top: 1px solid var(--border); font-size: 0.85rem; }
  .pending-row:first-child { border-top: 0; }
  .pending-row .tag { margin-left: 0; }

  #holdings-status { margin: -0.5rem 0 1rem; }
  #holdings-pending { margin-bottom: 1rem; }
  tr.detail-row > td { background: var(--bg); padding: 0; text-align: left; white-space: normal; }
  .position-detail { padding: 0.75rem 1rem 1rem; display: grid; gap: 0.75rem; }
  table.lots th { cursor: default; background: transparent; }
  table.lots th, table.lots td { padding: 5px 10px; }
  tr.lot-edit > td { text-align: left; white-space: normal; }
  .position-detail .ops-form { margin: 0; padding: 0.25rem 0; }
  /* Stops on the left, the alert on the right. minmax(0,1fr) rather than 1fr:
     a grid track's default min-width is auto, so the alert form's own controls
     would push the column wider than its half instead of wrapping. */
  .detail-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.75rem 1.5rem; align-items: start; }
  .alert-col { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; align-items: flex-end; }
  /* The edit form is a card in a drawer, where it stands alone. Here it is one
     of two columns, so it drops the frame to sit flush like the stop form. */
  .alert-col .ops-form.card { background: transparent; border: 0; border-radius: 0; }
  .alert-col > .form-title { flex-basis: 100%; font-size: 0.9rem; }
  .alert-col .note { flex-basis: 100%; }
  .row-actions { display: inline-flex; gap: 6px; }
  .approach-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; padding: 3px 0; font-size: 0.85rem; }
  .approach-dist { min-width: 4.5rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--subtext); }
  .stop-list { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .stop-tag { display: inline-flex; align-items: center; gap: 6px; margin-left: 0; padding: 2px 6px; }
  .stop-tag button { font-size: 0.72rem; padding: 0 6px; }
  button.danger { border-color: var(--red); color: var(--red); }
  @media (max-width: 560px) {
    .trigger-row, .drawer .trigger-row { grid-template-columns: 1fr; gap: 2px; }
    .queue-row { grid-template-columns: 36px 1fr; }
    .detail-cols { grid-template-columns: 1fr; }
    dl.kv-list { grid-template-columns: 1fr; gap: 0.1rem; }
    dl.kv-list dd { margin-bottom: 0.5rem; }
  }
</style>
</head>
<body>
<header class="site-header">
  <h1 class="site-title">Alerts</h1>
  <nav class="site-nav" aria-label="Views">
    <a href="#/" data-nav="overview">Overview</a>
    <a href="#/queue" data-nav="queue">Revisit queue <span id="nav-queue-count" class="nav-count"></span></a>
    <a href="#/stories" data-nav="stories">Stories <span id="nav-stories-count" class="nav-count"></span></a>
    <a href="#/alerts" data-nav="alerts">Alerts <span id="nav-alerts-count" class="nav-count"></span></a>
    <!-- Shown when holdings are available: decrypted from vault.json after unlocking, or published in the clear (web.holdings). -->
    <a href="#/holdings" data-nav="holdings" id="nav-holdings" hidden>Holdings <span id="nav-holdings-count" class="nav-count"></span></a>
  </nav>
  <span id="updated" class="meta">loading…</span>
  <span class="spacer"></span>
  <div class="header-right">
    <span id="notify-state" class="meta"></span>
    <button id="notify-btn" hidden>Enable notifications</button>
    <!-- Shown only when the published document has site.ops = true (OPS_QUEUE_URL configured). -->
    <button id="ops-btn" hidden>Unlock editing</button>
    <button id="theme-btn">☀️ Light</button>
  </div>
</header>

<main>
  <div id="error" class="card empty" hidden></div>
  <!-- Shown when the publisher reports opsAuthExpiredSince: checks are stopped
       until someone re-runs `schwab-login` on the machine. -->
  <div id="auth-banner" hidden></div>

  <section id="view-overview">
    <section id="tiles" class="tiles"></section>

    <div class="section-header"><h2 class="section-title">Recent triggers</h2><span id="triggers-count" class="section-count"></span></div>
    <div id="triggers" class="card"></div>

    <!-- Collapsed, like the quiet watches: on a 500-alert book a hundred names
         sit within a few percent of firing at any moment, which is a readout of
         market noise rather than a list of things to do. The queue says what
         actually happened; this answers "what is close?" when you ask. -->
    <div id="approaching-section" hidden>
      <div class="section-header"><h2 class="section-title">Approaching</h2></div>
      <details class="card"><summary id="approaching-summary"></summary><div id="approaching"></div></details>
    </div>

    <div id="quiet-section" hidden>
      <div class="section-header"><h2 class="section-title">Quiet watches</h2></div>
      <details class="card"><summary id="quiet-summary"></summary><ul id="quiet"></ul></details>
    </div>
  </section>

  <section id="view-queue" hidden>
    <div class="section-header"><h2 class="section-title">Revisit queue</h2><span id="queue-count" class="section-count"></span></div>
    <div id="queue" class="card"></div>
  </section>

  <section id="view-stories" hidden>
    <div class="section-header"><h2 class="section-title">Stories</h2><span id="stories-count" class="section-count"></span></div>
    <div id="stories" class="card"></div>
  </section>

  <section id="view-holdings" hidden>
    <div class="section-header"><h2 class="section-title">Holdings</h2><span id="holdings-count" class="section-count"></span></div>
    <p id="holdings-status" class="note"></p>
    <!-- Hidden until there is more than one account to choose between. -->
    <div class="toolbar" id="holdings-toolbar" hidden>
      <select id="holdings-account" aria-label="Filter by account"><option value="all">All accounts</option></select>
    </div>
    <div id="lot-add" hidden></div>
    <div id="holdings-pending" class="card" hidden></div>
    <div class="card table-wrap"><table id="holdings"></table></div>
  </section>

  <section id="view-alerts" hidden>
    <div class="section-header"><h2 class="section-title">Alerts</h2><span id="alerts-status" class="section-count"></span></div>
    <div class="toolbar">
      <input id="alerts-search" type="search" placeholder="Search symbol or condition" aria-label="Search alerts">
      <select id="alerts-kind" aria-label="Filter by kind"><option value="all">All kinds</option></select>
      <select id="alerts-sort" aria-label="Sort">
        <option value="symbol">Sort: symbol</option>
        <option value="closest">Sort: closest to level</option>
        <option value="triggered">Sort: most triggered</option>
        <option value="recent">Sort: recently fired</option>
        <option value="newest">Sort: newest</option>
      </select>
    </div>
    <div id="alert-add" hidden></div>
    <div id="ops-pending" class="card" hidden></div>
    <!-- The A-Z rail is built beside the table, not inside it, so the table
         keeps its own horizontal scroll. Populated only when sorted by symbol. -->
    <div class="indexed">
      <nav id="alerts-index" class="alpha-rail" aria-label="Jump to symbol" hidden></nav>
      <div class="card table-wrap"><table id="alerts-table"></table></div>
    </div>
  </section>
</main>

<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" tabindex="-1" aria-label="Details" hidden>
  <button id="drawer-close" class="drawer-close" aria-label="Close details">Close</button>
  <div id="drawer-body"></div>
</aside>

<div id="chart-backdrop" class="backdrop chart-backdrop" hidden></div>
<aside id="chart-panel" class="chart-panel" tabindex="-1" aria-label="Chart" hidden>
  <button id="chart-close" class="drawer-close" aria-label="Close chart">Close</button>
  <h2 id="chart-title" class="drawer-title"></h2>
  <iframe id="chart-frame" title="TradingView chart"></iframe>
</aside>

<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
