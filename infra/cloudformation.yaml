AWSTemplateFormatVersion: '2010-09-09'
Description: >
  equity-watch dashboard — static site hosting.
  S3 bucket (private) + CloudFront (HTTPS, optional basic auth) + IAM publish user.
  Deploy in us-east-1: ACM certificates used by CloudFront must live there.

  Adapted from uniquetrades-congress. It publishes every few minutes, so the
  publisher relies on Cache-Control: no-cache instead of invalidations
  (which are billed past 1,000 paths a month).

  Basic auth is off by default and the site is public. Set
  EnableBasicAuth=true before turning on web.holdings in analysis.config.json.

  EnableOps=true lets the page change alerts, the revisit queue and holdings:
  POST /api/ops goes to a Lambda (token check) that queues the change on SQS,
  and `ops pull` on the machine running checks applies it. Reads stay public;
  only writes need the token.

  Adding an op type means adding it to TARGET_KEY below AND redeploying this
  stack, or the page gets "Unknown op type" from a Lambda that has never heard
  of it. tests/lambdaContract.test.ts asserts this map and OP_TYPES agree.

Parameters:

  BucketName:
    Type: String
    Description: S3 bucket name (globally unique, e.g. equity-watch-yourname).

  EnableBasicAuth:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >
      Put a username/password prompt in front of the whole site. Required
      before publishing holdings (web.holdings in analysis.config.json).

  BasicAuthUser:
    Type: String
    Default: ''
    Description: Username the browser will prompt for (only with EnableBasicAuth=true).

  BasicAuthPassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Password the browser will prompt for (only with EnableBasicAuth=true;
      use 12+ characters). It is embedded in the CloudFront Function code, so
      anyone with CloudFront console access to this account can read it.

  EnableOps:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >
      Let the dashboard queue alert changes (add, edit) for `ops pull` to apply.
      Requires OpsToken.

  OpsToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      Bearer token the page must send to queue a change (only with EnableOps=true).
      32+ random characters, e.g. from `openssl rand -hex 32`. The Lambda refuses
      every request while it is shorter. Stored in the Lambda's environment.

  CustomDomain:
    Type: String
    Default: ''
    Description: >
      Custom domain to serve from, e.g. dashboard.example.com. Empty (the default)
      serves from the distribution's cloudfront.net URL instead. Deliberately
      undefaulted: a template in a public repo should not carry anyone's domain.
      Pass it on EVERY deploy once a stack has one - omitting it on a later deploy
      removes the alias and the certificate.

  HostedZoneId:
    Type: String
    Default: ''
    # Must be the PUBLIC hosted zone. A private zone of the same name is easy to
    # pick by mistake, and certificate validation and the alias record both have
    # to go in the public one or nothing outside the VPC can resolve them.
    Description: Route 53 public Hosted Zone ID for CustomDomain. Required when CustomDomain is set.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]
  HasBasicAuth: !Equals [!Ref EnableBasicAuth, 'true']
  HasOps: !Equals [!Ref EnableOps, 'true']

Resources:

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Wildcard distribution ID avoids a BucketPolicy <-> Distribution cycle.
  # Restricted to this AWS account.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringLike:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'

  BasicAuthFunction:
    Type: AWS::CloudFront::Function
    Condition: HasBasicAuth
    Properties:
      Name: !Sub '${BucketName}-basic-auth'
      AutoPublish: true
      FunctionConfig:
        Comment: Basic auth for the alert dashboard
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var auth = event.request.headers.authorization;
            if (auth && auth.value === 'Basic ${Expected}') {
              return event.request;
            }
            return {
              statusCode: 401,
              statusDescription: 'Unauthorized',
              headers: { 'www-authenticate': { value: 'Basic realm="alerts"' } }
            };
          }
        # Long form: YAML allows only one tag per node, so `!Base64 !Sub` is invalid.
        - Expected:
            Fn::Base64: !Sub '${BasicAuthUser}:${BasicAuthPassword}'

  # ---- Ops: dashboard write-back (EnableOps) ---------------------------------

  OpsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: HasOps
    Properties:
      QueueName: !Sub '${BucketName}-ops-dlq.fifo'
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  # FIFO with the op id as the dedup id: ordered, and a double-click is one
  # message. Dedup lasts only 5 minutes, so the worker's op log is what really
  # prevents a double apply. maxReceiveCount is generous because a message is
  # received once per scheduled run, and a lapsed Schwab login fails every run
  # until you log in again.
  OpsQueue:
    Type: AWS::SQS::Queue
    Condition: HasOps
    Properties:
      QueueName: !Sub '${BucketName}-ops.fifo'
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OpsDeadLetterQueue.Arn
        maxReceiveCount: 40

  OpsFunctionRole:
    Type: AWS::IAM::Role
    Condition: HasOps
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OpsEnqueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt OpsQueue.Arn

  # Token and shape checks only. Every semantic check (does the alert exist,
  # does the level make sense against a live quote) happens in `ops pull`,
  # against real state. Inline, so it can't import from src/.
  OpsFunction:
    Type: AWS::Lambda::Function
    Condition: HasOps
    Properties:
      FunctionName: !Sub '${BucketName}-ops'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt OpsFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          OPS_TOKEN: !Ref OpsToken
          QUEUE_URL: !Ref OpsQueue
      Code:
        ZipFile: |
          const crypto = require("crypto");
          const { SQSClient, SendMessageCommand } = require("@aws-sdk/client-sqs");
          const sqs = new SQSClient({});
          const TOKEN = process.env.OPS_TOKEN || "";
          const ID = /^[A-Za-z0-9-]{8,64}$/;
          const MAX_BODY = 16384;
          const reply = (statusCode, body) => ({
            statusCode,
            headers: { "content-type": "application/json", "cache-control": "no-store" },
            body: JSON.stringify(body),
          });
          const isObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
          function authorized(header) {
            const m = /^Bearer (.+)$/.exec(header || "");
            if (!m || TOKEN.length < 32) return false;
            // Hash both sides so the comparison is constant-time whatever the lengths.
            const given = crypto.createHash("sha256").update(m[1]).digest();
            const expected = crypto.createHash("sha256").update(TOKEN).digest();
            return crypto.timingSafeEqual(given, expected);
          }
          exports.handler = async (event) => {
            const method = event.requestContext && event.requestContext.http && event.requestContext.http.method;
            if (method !== "POST") return reply(405, { error: "POST only" });
            if (!authorized(event.headers && event.headers.authorization)) return reply(401, { error: "Bad or missing token" });
            let raw = event.body || "";
            if (event.isBase64Encoded) raw = Buffer.from(raw, "base64").toString("utf8");
            if (raw.length > MAX_BODY) return reply(413, { error: "Body too large" });
            let op;
            try {
              op = JSON.parse(raw);
            } catch (e) {
              return reply(400, { error: "Body must be JSON" });
            }
            if (!isObject(op) || typeof op.id !== "string" || !ID.test(op.id)) return reply(400, { error: "Bad op id" });
            // Op type -> the target key it must name. Keep in step with OP_TYPES in src/ops/apply.ts.
            const TARGET_KEY = {
              "alert.add": null, "alert.edit": "alertId", "alert.remove": "alertId",
              "revisit.relevel": "revisitId", "revisit.apply": "revisitId", "revisit.dismiss": "revisitId",
              "lot.add": null, "lot.edit": "lotId", "lot.remove": "lotId", "position.remove": "symbol",
              "stop.add": null, "stop.edit": "stopId", "stop.remove": "stopId", "holdings.cover": "symbol",
            };
            if (typeof op.type !== "string" || !Object.prototype.hasOwnProperty.call(TARGET_KEY, op.type)) return reply(400, { error: "Unknown op type" });
            if (!isObject(op.params)) return reply(400, { error: "params must be an object" });
            const key = TARGET_KEY[op.type];
            if (key && (!isObject(op.target) || typeof op.target[key] !== "string")) return reply(400, { error: "This op needs target." + key });
            if (op.expect !== undefined && !isObject(op.expect)) return reply(400, { error: "expect must be an object" });
            const message = { id: op.id, type: op.type, createdAt: new Date().toISOString(), params: op.params, target: op.target, expect: op.expect };
            await sqs.send(new SendMessageCommand({
              QueueUrl: process.env.QUEUE_URL,
              MessageBody: JSON.stringify(message),
              MessageGroupId: "ops",
              MessageDeduplicationId: op.id,
            }));
            return reply(202, { id: op.id, queued: true });
          };

  # Named the way Lambda names its own log group, so the function writes here.
  # Declared so it has a retention period and is removed with the stack; left
  # to Lambda it would keep logs forever and outlive a stack deletion.
  OpsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasOps
    Properties:
      LogGroupName: !Sub '/aws/lambda/${BucketName}-ops'
      RetentionInDays: 14

  OpsFunctionUrl:
    Type: AWS::Lambda::Url
    Condition: HasOps
    Properties:
      TargetFunctionArn: !GetAtt OpsFunction.Arn
      AuthType: NONE

  # Since October 2025 a public function URL needs both permissions, or every
  # request gets 403. InvokedViaFunctionUrl limits the second to URL calls, so
  # this doesn't also open the function to direct Invoke from any account.
  OpsFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Condition: HasOps
    Properties:
      FunctionName: !Ref OpsFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  OpsFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasOps
    Properties:
      FunctionName: !Ref OpsFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref CustomDomain
          HostedZoneId: !Ref HostedZoneId

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: BucketPolicy
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref OAC
          - !If
            - HasOps
            - Id: OpsOrigin
              # FunctionUrl is https://<id>.lambda-url.<region>.on.aws/; the origin wants the bare host.
              DomainName: !Select [2, !Split ['/', !GetAtt OpsFunctionUrl.FunctionUrl]]
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue
        # Same origin as the page, so the POST needs no CORS. No basic-auth
        # function here: the Lambda's token check is the gate for writes.
        CacheBehaviors: !If
          - HasOps
          - - PathPattern: /api/*
              TargetOriginId: OpsOrigin
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              # AWS managed CachingDisabled.
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              # AWS managed AllViewerExceptHostHeader: forwards Authorization,
              # but not Host, which a function URL rejects if it's the site's.
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              Compress: false
          - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized. It honors the origin's
          # Cache-Control, and every object is uploaded with no-cache.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations: !If
            - HasBasicAuth
            - - EventType: viewer-request
                FunctionARN: !GetAtt BasicAuthFunction.FunctionMetadata.FunctionARN
            - !Ref AWS::NoValue
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomain]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomain
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2   # fixed zone ID for all CloudFront distributions
        DNSName: !GetAtt Distribution.DomainName
        EvaluateTargetHealth: false

  PublishUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'equity-watch-publisher-${BucketName}'
      Policies:
        - PolicyName: DashboardPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${Bucket.Arn}/*'
              - !If
                - HasOps
                - Effect: Allow
                  Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                  Resource: !GetAtt OpsQueue.Arn
                - !Ref AWS::NoValue

  PublishAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref PublishUser

Outputs:
  SiteUrl:
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${CustomDomain}'
      - !Sub 'https://${Distribution.DomainName}'
  BucketName:
    Description: S3_BUCKET in .env
    Value: !Ref Bucket
  Region:
    Description: AWS_REGION in .env
    Value: !Ref AWS::Region
  AccessKeyId:
    Description: AWS_ACCESS_KEY_ID in .env
    Value: !Ref PublishAccessKey
  SecretAccessKey:
    Description: AWS_SECRET_ACCESS_KEY in .env (visible here only; store securely)
    Value: !GetAtt PublishAccessKey.SecretAccessKey
  OpsQueueUrl:
    Condition: HasOps
    Description: OPS_QUEUE_URL in .env (enables `ops pull` and the page's editing controls)
    Value: !Ref OpsQueue
