# Run equity-watch's scheduled check-and-publish job on a Docker host.
# Setup, first login, moving existing state in, and updating: docker/README.md.
#
#   docker compose -f docker/docker-compose.yaml up -d --build
#   docker compose -f docker/docker-compose.yaml logs -f
#
# Two files feed it, and neither is copied into the image:
#   ../.env       the app's settings (Schwab, AWS/S3, OPS_*), passed to the container.
#   docker/.env   STATE_DIR and SHARED_DIR, read by compose itself to fill in the volume
#                 paths below (template: docker/.env.example).
# Compose reads both on the machine running it, so with DOCKER_HOST=ssh://user@host
# they need not exist on the host.

name: equity-watch

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: equity-watch:latest
  # TZ can be set here too; the image defaults it. The schedule is docker/crontab.
  env_file: ../.env
  volumes:
    # STATE_DIR is an absolute path on the Docker host holding alerts.json,
    # revisits.json, holdings.json, ops.log.jsonl, .cache/, site/ and the Schwab
    # tokens (.equity_watch/). Losing it loses your alerts, so back it up.
    # It is required, with no default: a missing one would mount an empty
    # directory, and the first run would publish an empty dashboard over the real one.
    # :z relabels for SELinux hosts (Fedora CoreOS); other hosts ignore it.
    - &state-volume ${STATE_DIR:?set STATE_DIR in docker/.env to an absolute path on the Docker host}:/data:z
  init: true

# Betas for another program (`equity-watch beta`, docker/run-beta.sh), in a
# directory both containers mount. Only the services that run the CLI get it, and
# a service's own `volumes:` replaces the merged one, so they list both mounts.
# Like STATE_DIR it is required with no default, for the same reason: an unset one
# would let Docker create it root-owned, and the beta job could not write there.
# :z, not :Z. :Z labels the directory for one container alone and would lock the
# other program out. It is the directory that is mounted, not betas.json, because
# the write is a rename of a temp file made beside it. Host setup (once):
# owned by uid 1000, mode 0755. docker/README.md has the commands.
x-shared-volume: &shared-volume "${SHARED_DIR:?set SHARED_DIR in docker/.env to an absolute path on the Docker host}:/shared:z"

services:
  equity-watch:
    <<: *common
    restart: unless-stopped
    volumes: [*state-volume, *shared-volume]
    # A run takes seconds, but `docker stop` waits for the one in flight.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # The dashboard's agent tools over MCP (Streamable HTTP), for Open WebUI and the
  # like: http://<MCP_HOSTNAME>:4180/mcp. Off unless docker/.env says
  #   COMPOSE_PROFILES=mcp
  # It reads the published site and queues through /api/ops like the page, so it
  # needs OPS_TOKEN, MCP_HTTP_TOKEN (the bearer clients send; the server refuses to
  # listen beyond loopback without one) and, with basic auth on the site,
  # BASIC_AUTH_USER/BASIC_AUTH_PASSWORD, all from ../.env. MCP_FLAGS adds server
  # flags, e.g. "--require-approval" or "--allow-holdings" (docs/MCP.md).
  # /data holds only its pending-changes file.
  #
  # It sits on the home network's macvlan with its own address, which CoreDNS
  # names from the label. As with any macvlan container, the Docker host itself
  # can't reach that address; other containers on app-network (Open WebUI) can.
  mcp:
    <<: *common
    profiles: ["mcp"]
    restart: unless-stopped
    entrypoint:
      - /app/docker/entrypoint.sh
      - sh
      - -c
      - exec equity-watch mcp --http 4180 --host 0.0.0.0 --pending-file /data/.cache/mcp-pending.json $$MCP_FLAGS
    command: []
    # The image's healthcheck watches scheduled runs, which this container never makes.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4180/mcp', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 1m
      timeout: 10s
      start_period: 30s
    labels:
      - "coredns.dockerdiscovery.host=${MCP_HOSTNAME:-}"
    networks:
      app-network:
        ipv4_address: ${MCP_IPV4:-}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # One-off CLI against the same state, e.g. the weekly Schwab login:
  #   docker compose -f docker/docker-compose.yaml run --rm cli schwab-login
  # Never started by `up`: it needs the "tools" profile, which `run` turns on.
  cli:
    <<: *common
    profiles: ["tools"]
    volumes: [*state-volume, *shared-volume]
    entrypoint: ["/app/docker/entrypoint.sh", "equity-watch"]
    command: []

networks:
  # The home network's macvlan, created outside this project. Only the mcp
  # service joins it.
  app-network:
    external: true
